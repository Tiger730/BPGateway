name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BPGateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit test (parser)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BPGateway-apk
          path: |
            BPGateway/app/build/outputs/apk/debug/app-debug.apk
            BPGateway/app/build/outputs/apk/release/app-release.apk
